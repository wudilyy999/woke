[project]
name = "woke"
version = "0.1.0"
description = "A small event-sourced coding-agent runtime. The log is the only fact."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "liyuyang" }]
# Runtime: Python standard library only (including sqlite3).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
woke = "woke.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["woke"]
